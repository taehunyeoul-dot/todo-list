<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="할일메모">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF3FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1420">
<title>할 일 메모</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
  :root{
    --bg:#EEF3FA; --surface:#FFFFFF; --ink:#1B2536; --sub:#8792A2;
    --line:rgba(27,37,54,.1); --accent:#2160C4; --accent-soft:rgba(33,96,196,.08);
    --danger:#BE3B3B; --chk-check:#FFFFFF; --press:rgba(27,37,54,.05);
    --dim:rgba(15,20,32,.45); --field:#E4EBF5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1420; --surface:#1A2130; --ink:#EEF2F8; --sub:#8E99AD;
      --line:rgba(238,242,248,.12); --accent:#7CA9F2; --accent-soft:rgba(124,169,242,.13);
      --danger:#E2685F; --chk-check:#0F1420; --press:rgba(238,242,248,.06);
      --dim:rgba(0,0,0,.55); --field:#242E42;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    position:fixed; inset:0; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;color:var(--ink);}
  button{
    font-family:inherit; background:none; border:none; color:var(--ink);
    font-size:17px; cursor:pointer; touch-action:manipulation; padding:0;
  }
  button:active{opacity:.55;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

  #app{position:absolute;inset:0;display:flex;flex-direction:column;}

  /* ===== 상단 바 ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 18px 8px;
    min-height:44px;flex-shrink:0;
  }
  .tb-btn{font-size:16px;color:var(--accent);letter-spacing:-.2px;}
  .tb-btn.danger{color:var(--danger);}
  .tb-btn .chev{font-size:22px;line-height:1;vertical-align:-2px;margin-right:1px;}

  .screen{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;overflow-x:hidden;
    padding:0 18px calc(40px + env(safe-area-inset-bottom));
  }

  /* ===== 첫 화면 ===== */
  .home{flex:1;display:flex;flex-direction:column;}
  .home-mark{
    text-align:center;font-size:13px;letter-spacing:.28em;color:var(--sub);
    padding:calc(26px + env(safe-area-inset-top)) 0 6px;
  }
  .home-panel{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center;
  }
  .home-panel:active{background:var(--press);opacity:1;}
  .hp-title{font-size:34px;font-weight:700;letter-spacing:-.5px;}
  .hp-sub{font-size:14px;color:var(--sub);letter-spacing:-.1px;}
  .home-hr{height:1px;background:var(--line);margin:0 34px;flex-shrink:0;}
  .home-row{flex:1;display:flex;min-height:0;}
  .home-row .home-panel{flex:1;min-width:0;}
  .home-row .hp-title{font-size:25px;}
  .home-vr{width:1px;background:var(--line);margin:26px 0;flex-shrink:0;}
  .home-foot{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 0 calc(20px + env(safe-area-inset-bottom));
  }
  .home-foot-row{display:flex;justify-content:center;align-items:center;gap:11px;color:var(--sub);}
  .home-foot button{font-size:13px;color:var(--sub);}
  .home-foot .sep{font-size:11px;}
  .home-sync{font-size:12px;color:var(--accent);min-height:15px;}
  .home-dirty{font-size:12px;color:var(--danger);text-align:center;padding:0 20px;line-height:1.5;}
  .home-dirty:empty{display:none;}
  .home-ver{font-size:11px;color:var(--sub);opacity:.6;}
  .sync-badge{font-size:12px;color:var(--sub);white-space:nowrap;}
  .sync-badge.wait{color:var(--danger);}
  .sync-badge.ok{color:var(--accent);}

  /* ===== 메모하기 (편집) ===== */
  .memo-meta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:2px 2px 16px;
  }
  .memo-meta .when{font-size:13px;color:var(--sub);letter-spacing:-.1px;}
  .label-chip{
    font-size:13px;color:var(--accent);background:var(--accent-soft);
    padding:5px 12px;border-radius:999px;max-width:55%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .label-chip.empty{color:var(--sub);background:transparent;border:1px dashed var(--line);}

  .item{display:flex;align-items:flex-start;gap:12px;padding:9px 0;}
  .chk{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;margin-top:2px;
    border:1.5px solid var(--sub);background:transparent;position:relative;
  }
  .item.done .chk{background:var(--accent);border-color:var(--accent);}
  .item.done .chk::after{
    content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;
    border-right:2px solid var(--chk-check);border-bottom:2px solid var(--chk-check);
    transform:rotate(42deg);
  }
  .item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .item-text{
    width:100%;border:none;background:transparent;resize:none;outline:none;
    font-size:17px;line-height:1.45;overflow:hidden;
  }
  .item.done .item-text{color:var(--sub);}
  .item-date{font-size:12px;color:var(--accent);letter-spacing:-.1px;}
  .item-result{
    width:100%;border:none;resize:none;outline:none;overflow:hidden;
    font-size:14px;line-height:1.45;color:var(--sub);
    background:var(--field);border-radius:8px;padding:7px 10px;
  }
  .item-result::placeholder{color:var(--sub);opacity:.55;}

  .ghost-add{
    display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;
    color:var(--sub);font-size:16px;
  }
  .ghost-add .ring{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    border:1.5px dashed var(--line);
  }

  .editor-screen{padding-bottom:calc(140px + env(safe-area-inset-bottom));}
  .editor-bar{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 26px calc(14px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--line);
    transition:transform .15s ease;
  }
  .editor-bar button{font-size:16px;font-weight:600;color:var(--accent);padding:6px 4px;letter-spacing:-.2px;}

  /* ===== 메모찾기 ===== */
  .find-title{font-size:28px;font-weight:700;letter-spacing:-.4px;padding:2px 2px 14px;}
  .search{
    width:100%;font-size:16px;background:var(--field);border:none;outline:none;
    border-radius:11px;padding:11px 14px;margin-bottom:14px;
  }
  .search::placeholder{color:var(--sub);opacity:.7;}
  .chips{
    display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:16px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    padding-bottom:6px;
  }
  .chips::-webkit-scrollbar{height:4px;}
  .chips::-webkit-scrollbar-track{background:transparent;}
  .chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
  .chip{
    display:flex;align-items:center;
    font-size:14px;color:var(--sub);border:1px solid var(--line);
    padding:7px 14px;border-radius:999px;background:transparent;letter-spacing:-.1px;
    flex-shrink:0;white-space:nowrap;
  }
  .chip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex-shrink:0;}

  .find-section{font-size:13px;font-weight:700;color:var(--sub);margin:6px 2px 10px;letter-spacing:.02em;}
  .find-section .n{font-weight:500;margin-left:6px;}
  .group{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:14px;}
  .mrow{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;width:100%;text-align:left;position:relative;}
  .mrow + .mrow::before{content:"";position:absolute;top:0;left:45px;right:0;height:1px;background:var(--line);}
  .mrow:active{opacity:1;background:var(--press);}
  .mrow .dot{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:1px;
    border:1.5px solid var(--sub);position:relative;
  }
  .mrow.done .dot{background:var(--accent);border-color:var(--accent);}
  .mrow.done .dot::after{
    content:"";position:absolute;left:5.5px;top:2.5px;width:5px;height:9px;
    border-right:1.8px solid var(--chk-check);border-bottom:1.8px solid var(--chk-check);
    transform:rotate(42deg);
  }
  .mrow-body{flex:1;min-width:0;}
  .mrow-text{font-size:16px;line-height:1.4;word-break:break-word;}
  .mrow.done .mrow-text{color:var(--sub);}
  .mrow-sub{font-size:12px;color:var(--sub);margin-top:3px;}
  .mrow-sub .lb{color:var(--accent);font-weight:600;}
  .mrow-result{
    font-size:13px;color:var(--sub);margin-top:5px;
    background:var(--field);border-radius:7px;padding:5px 8px;word-break:break-word;
  }
  .today-btn{
    flex-shrink:0;align-self:center;margin-left:4px;
    font-size:12px;font-weight:600;color:var(--sub);
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  }
  .today-btn.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .trm{flex-shrink:0;align-self:center;font-size:12px;color:var(--sub);padding:6px 2px 6px 6px;}
  .mrow .dot.tap{width:24px;height:24px;}
  .mrow.done .dot.tap::after{left:7px;top:3.5px;width:6px;height:11px;}
  .find-empty{text-align:center;color:var(--sub);font-size:15px;line-height:1.7;padding:60px 20px;}
  .reveal-btn{
    display:block;margin:14px auto 0;font-size:14px;color:var(--sub);
    padding:9px 18px;border:1px solid var(--line);border-radius:999px;
  }
  .gap{height:18px;}

  /* ===== 시트(팝업) ===== */
  .backdrop{
    position:fixed;inset:0;background:var(--dim);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn .16s ease;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:560px;
    border-radius:18px 18px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideUp .22s cubic-bezier(.3,1,.4,1);
    max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .sheet h2{font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px;}
  .sheet .desc{font-size:14px;color:var(--sub);margin-bottom:16px;line-height:1.55;word-break:break-word;}
  .sheet .desc b{color:var(--ink);font-weight:600;}
  .label-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .label-opt{
    border:1px solid var(--line);border-radius:11px;padding:13px 8px;
    font-size:16px;text-align:center;letter-spacing:-.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .label-opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .label-opt.none{color:var(--sub);}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .sheet-foot button{font-size:16px;color:var(--accent);font-weight:600;padding:6px 2px;}
  .sheet-foot .quiet{color:var(--sub);font-weight:500;}

  .label-edit-row{
    display:flex;align-items:center;gap:8px;padding:7px 0;
    background:var(--surface);
  }
  .label-edit-row input,.label-add-row input,.token-input{
    flex:1;font-size:16px;background:var(--field);border:none;outline:none;
    border-radius:9px;padding:10px 12px;min-width:0;
  }
  .label-edit-row.dragging{
    position:relative;z-index:5;border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
  }
  .label-edit-row.is-hidden .cdot{opacity:.3;}
  .label-edit-row.is-hidden input{color:var(--sub);}
  .lrow-del{font-size:13px;color:var(--danger);flex-shrink:0;padding:8px 3px;}
  .lrow-hide{font-size:13px;color:var(--sub);flex-shrink:0;padding:8px 3px;}
  .label-edit-row.is-hidden .lrow-hide{color:var(--accent);font-weight:600;}
  .lrow-handle{
    width:34px;height:34px;flex-shrink:0;border-radius:9px;background:var(--field);
    color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;
    touch-action:none;cursor:grab;
  }
  .backdrop.confirm{z-index:60;}
  .label-add-row{display:flex;align-items:center;gap:10px;padding:10px 0 2px;}
  .label-add-row .go{font-size:15px;color:var(--accent);font-weight:600;flex-shrink:0;}

  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;font-size:16px;font-weight:600;border-radius:12px;padding:14px;text-align:center;letter-spacing:-.2px;}
  .btn.primary{background:var(--ink);color:var(--bg);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.plain{background:var(--field);color:var(--ink);}

  .tool-list{display:flex;flex-direction:column;gap:10px;}
  .tool-btn{
    background:var(--field);color:var(--ink);
    font-size:15px;font-weight:600;border-radius:12px;padding:13px;text-align:center;
  }
  .snap-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 2px;border-bottom:1px solid var(--line);
  }
  .snap-row:last-child{border-bottom:none;}
  .snap-row .t{font-size:15px;}
  .snap-row .t small{display:block;font-size:12px;color:var(--sub);margin-top:2px;}
  .snap-row .go{font-size:14px;font-weight:600;color:var(--accent);flex-shrink:0;padding:6px 2px;}
  .sync-status{
    font-size:14px;font-weight:600;margin-bottom:14px;padding:11px 13px;
    background:var(--field);border-radius:10px;
  }
  .sync-err{font-size:13px;color:var(--danger);margin-top:8px;min-height:16px;}
  .steps{font-size:14px;color:var(--sub);line-height:1.7;margin-bottom:14px;}
  .steps b{color:var(--ink);font-weight:600;}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(36px);opacity:.6}to{transform:translateY(0);opacity:1}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ================================================================
   할 일 메모 — 메모하기 / 메모찾기
   저장 구조(3중):
   1) localStorage (즉시)
   2) 자동 스냅샷: 하루 1회, 최근 7일분 보관 (복원 가능)
   3) 클라우드 동기화: GitHub 비공개 Gist에 자동 백업(수정 이력 포함)
   ================================================================ */

const APP_VERSION = "26";   /* 배포할 때 sw.js의 CACHE 번호와 같이 올린다 */
const KEY = "memo-todo-v2";
const SNAP = "memo-todo-snap-";
const SYNC_KEY = "memo-todo-sync";
const GIST_DESC = "할일메모-데이터(자동 동기화)";
const GIST_FILE = "memo-data.json";

let state = load();
let searchQ = "";
let filterLabel = "all";
let showHidden = false;

/* 라벨 자동 색상 — 밝은/어두운 배경 모두에서 읽히는 8색 */
const LABEL_COLORS = ["#3B82D6","#199C87","#D08A2B","#9A6AD8","#D2497E","#7BA43B","#D05A50","#5E93B8"];
function nextLabelColor(){
  const used = {};
  state.labels.forEach(l=>{ if(l.color) used[l.color] = (used[l.color]||0)+1; });
  let best = LABEL_COLORS[0], bestN = Infinity;
  LABEL_COLORS.forEach(c=>{ const n = used[c]||0; if(n < bestN){ bestN = n; best = c; } });
  return best;
}
function assignColors(){
  let changed = false;
  state.labels.forEach(l=>{
    if(!l.color){ l.color = nextLabelColor(); l.updatedAt = Date.now(); changed = true; }
  });
  if(changed) save({keepStamp:true});
  return changed;
}

/* 라벨 순서 — order 필드로 관리해 모든 기기에서 같은 순서로 보이게 함 */
function sortedLabels(){
  return state.labels.slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
function assignOrder(){
  let changed = false;
  let next = state.labels.reduce((m,l)=> l.order!=null ? Math.max(m, l.order+1) : m, 0);
  state.labels.forEach(l=>{
    if(l.order==null){ l.order = next++; changed = true; }
  });
  if(changed) save({keepStamp:true});
  return changed;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.labels) && Array.isArray(d.memos)) return normDeleted(d);
  }catch(e){}
  return {
    labels:[ {id:uid(),name:"거래처"}, {id:uid(),name:"유튜브"}, {id:uid(),name:"대시보드"} ],
    memos:[], savedAt:0, deleted:{labels:{}, memos:{}}
  };
}
function save(opts){
  if(!(opts && opts.keepStamp)) state.savedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  if(!(opts && opts.noPush)) schedulePush();
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtDate(ts){
  if(!ts) return "";
  const d = new Date(ts), now = new Date();
  const same = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const yst = new Date(now); yst.setDate(now.getDate()-1);
  if(same(d,now)) return "오늘";
  if(same(d,yst)) return "어제";
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1)+"월 "+d.getDate()+"일";
  return d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+".";
}
function fmtTime(ts){
  const d = new Date(ts);
  const h = d.getHours(), ap = h<12 ? "오전" : "오후", h12 = h%12 || 12;
  return fmtDate(ts)+" "+ap+" "+h12+":"+pad2(d.getMinutes());
}
function labelName(id){
  const l = state.labels.find(x=>x.id===id);
  return l ? l.name : "";
}
/* 내용(할 일 또는 처리 결과)이 한 글자라도 있는 메모인지 */
function hasBody(m){
  return !!m && (m.items||[]).some(i=> (i.text||"").trim() || (i.result||"").trim());
}
/* edited=true: 할 일·처리 결과 내용을 고친 경우 → 작성일을 지금으로 바꿔 목록 맨 위로.
   오늘 보내기·완료 체크·라벨 변경 같은 상태 변경은 작성일을 건드리지 않아 자리가 그대로다. */
function touch(memo, edited){
  const now = Date.now();
  memo.updatedAt = now;
  if(edited){
    if(!memo.firstCreatedAt) memo.firstCreatedAt = memo.createdAt;   /* 처음 만든 날짜는 따로 보관 */
    memo.createdAt = now;
  }
  if(hasBody(memo)) memo.everHadBody = true;
  save();
}
/* 기존 데이터 중 내용 있는 메모에 '내용이 있었던 메모' 표시 */
function markBodies(){
  let ch = false;
  state.memos.forEach(m=>{ if(!m.everHadBody && hasBody(m)){ m.everHadBody = true; ch = true; } });
  if(ch) save({noPush:true, keepStamp:true});
}
/* 한 번도 내용이 없던 빈 메모 껍데기는 이 기기에서 조용히 치운다 (지금 쓰고 있는 메모는 제외) */
function pruneEmptyShells(){
  const r = route();
  const keepId = r.view==="edit" ? r.id : null;
  const before = state.memos.length;
  state.memos = state.memos.filter(m=> hasBody(m) || m.everHadBody || m.id===keepId);
  if(state.memos.length !== before) save({noPush:true, keepStamp:true});
}

/* ---------- 라우팅 ---------- */
function route(){
  const h = location.hash;
  const m = h.match(/^#\/edit\/(.+)$/);
  if(m) return {view:"edit", id:m[1]};
  if(h === "#/find") return {view:"find"};
  if(h === "#/today") return {view:"today"};
  return {view:"home"};
}
let lastRoute = route();
let renderedKey = null;

window.addEventListener("hashchange", ()=>{
  const r = route();
  if(lastRoute.view==="edit" && !(r.view==="edit" && r.id===lastRoute.id)){
    cleanupMemo(lastRoute.id);
  }
  lastRoute = r;
  render();
});

function cleanupMemo(id){
  const m = state.memos.find(x=>x.id===id);
  if(!m) return;
  /* 지우기 전에, 화면에 아직 남아 있는 입력칸의 값을 한 번 더 확인한다 */
  const row = document.querySelector(".item");
  if(row && typeof row._syncItem === "function"){
    try{ row._syncItem(); }catch(e){}
  }
  if(!hasBody(m)){
    state.memos = state.memos.filter(x=>x.id!==id);
    if(m.everHadBody){
      /* 내용이 있던 메모를 직접 비운 경우만 삭제 기록 — 다른 기기에서도 지워지게 */
      normDeleted(state);
      state.deleted.memos[id] = Date.now();
      save();
    }else{
      /* 한 번도 내용이 없던 빈 메모는 삭제 기록을 남기지 않는다.
         다른 기기에서 그 메모에 쓴 글이 이 삭제에 밀려 사라지는 일을 막기 위함 */
      save({noPush:true, keepStamp:true});
    }
  }
}

const app = document.getElementById("app");
/* 지금 메모 편집 화면에 있는지 — 입력 중 화면을 다시 그리지 않기 위한 판단 */
function isEditing(){ return route().view === "edit"; }
function render(force){
  const r = route();
  const key = r.view + (r.id||"");
  if(!force && r.view==="edit" && key===renderedKey) return;
  renderedKey = key;
  lastRoute = r;
  if(r.view==="edit") renderEdit(r.id);
  else if(r.view==="find") renderFind();
  else if(r.view==="today") renderToday();
  else renderHome();
}

/* ================================================================
   첫 화면
   ================================================================ */
function isDoneMemo(m){
  const texted = m.items.filter(i=>i.text.trim());
  return texted.length>0 && texted.every(i=>i.done);
}
/* 오늘할일 판별 */
function sameDayTs(a, b){
  const x = new Date(a), y = new Date(b);
  return x.getFullYear()===y.getFullYear() && x.getMonth()===y.getMonth() && x.getDate()===y.getDate();
}
function isTodayTs(ts){ return !!ts && sameDayTs(ts, Date.now()); }

function renderHome(){
  const done = state.memos.filter(isDoneMemo).length;
  const open = state.memos.length - done;
  const todayMemos = state.memos.filter(m=>isTodayTs(m.todayAt));
  const tDone = todayMemos.filter(isDoneMemo).length;
  const tSub = todayMemos.length
    ? `${todayMemos.length}개 중 ${tDone} 완료`
    : "메모찾기에서 보내기";
  app.innerHTML = `
    <div class="home">
      <div class="home-mark">할 일 메모</div>
      <button class="home-panel" onclick="startNewMemo()">
        <span class="hp-title">메모하기</span>
        <span class="hp-sub">바로 새 메모가 시작됩니다</span>
      </button>
      <div class="home-hr"></div>
      <div class="home-row">
        <button class="home-panel" onclick="location.hash='#/find'">
          <span class="hp-title">메모찾기</span>
          <span class="hp-sub">진행 중 ${open} · 완료 ${done}</span>
        </button>
        <div class="home-vr"></div>
        <button class="home-panel" onclick="location.hash='#/today'">
          <span class="hp-title">오늘할일</span>

        </button>

/* 메모 화면을 앱 안에서 열었는지 기억 — 삭제 후 되돌아갈 곳을 정할 때 쓴다 */
let editOpenedInApp = false;
function openEdit(id){
  editOpenedInApp = true;
  location.hash = "#/edit/"+id;
}
function startNewMemo(labelId){
  editOpenedInApp = true;

             items:[{id:uid(), text:"", done:false, checkedAt:null, result:""}]};

/* 메모찾기에서 새 메모: 보고 있던 라벨 탭이 있으면 그 라벨을 미리 지정 */
function newMemoFromFind(){

/* ================================================================
   메모하기 (편집)
   ================================================================ */
let currentId = null;
function currentMemo(){ return state.memos.find(m=>m.id===currentId); }

function renderEdit(id){
  const memo = state.memos.find(m=>m.id===id);
  if(!memo){ location.replace("#/find"); return; }
  currentId = id;
  app.innerHTML = `
    <div class="topbar">
      <button class="tb-btn" onclick="history.back()"><span class="chev">‹</span> 뒤로</button>
      <button class="tb-btn danger" onclick="askDeleteMemo()">삭제</button>
    </div>
    <div class="screen editor-screen">
      <div class="memo-meta">
        <span class="when">${fmtDate(memo.createdAt)} 작성</span>
        <span class="sync-badge" id="editSync"></span>
      </div>
      <div class="chips" id="editorChips"></div>
      <div id="items"></div>
    </div>
    <div class="editor-bar" id="editorBar">
      <span></span>
      <button onclick="newMemoFromEditor()">새 메모</button>
    </div>`;
  renderEditorChips(memo);
  buildItems(memo);
  adjustBar();
  renderSyncBadges();
}

function buildItems(memo){
  const wrap = document.getElementById("items");
  if(!wrap) return;
  if(!memo.items.length) memo.items.push({id:uid(), text:"", done:false, checkedAt:null, result:""});
  wrap.innerHTML = "";
  wrap.appendChild(itemNode(memo, memo.items[0]));
}

function itemNode(memo, it){
  const row = document.createElement("div");
  row.className = "item" + (it.done ? " done" : "");

  const chk = document.createElement("button");
  chk.className = "chk";
  chk.setAttribute("aria-label", it.done ? "완료 취소" : "완료");
  chk.onclick = ()=>{
    it.done = !it.done;
    it.checkedAt = it.done ? Date.now() : null;
    touch(memo);
    buildItems(memo);
  };

  const body = document.createElement("div");
  body.className = "item-body";

  const ta = document.createElement("textarea");
  ta.className = "item-text";
  ta.rows = 1;
  ta.value = it.text;
  ta.placeholder = "할 일";
  ta.oninput = ()=>{ it.text = ta.value; grow(ta); touch(memo, true); };
  body.appendChild(ta);

  if(it.done && it.checkedAt){
    const d = document.createElement("div");
    d.className = "item-date";
    d.textContent = fmtDate(it.checkedAt) + " 완료";
    body.appendChild(d);
  }

  const res = document.createElement("textarea");
  res.className = "item-result";
  res.rows = 1;
  res.value = it.result || "";
  res.placeholder = "처리 결과";
  res.oninput = ()=>{ it.result = res.value; grow(res); touch(memo, true); };
  body.appendChild(res);

  /* 안전장치: 입력칸을 벗어날 때 화면에 보이는 값을 한 번 더 저장한다.
     한글 조합 중이거나 입력 이벤트가 누락되는 상황에서도 글자가 사라지지 않게 함 */
  const sync = ()=>{
    let changed = false;
    if(it.text !== ta.value){ it.text = ta.value; changed = true; }
    if((it.result||"") !== res.value){ it.result = res.value; changed = true; }
    if(changed) touch(memo, true);
  };
  ta.onblur = sync;
  res.onblur = sync;
  row._syncItem = sync;

  row.appendChild(chk);
  row.appendChild(body);
  requestAnimationFrame(()=>{ grow(ta); grow(res); });
  return row;
}

function grow(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
function focusItem(idx, toEnd){
  const list = document.querySelectorAll(".item-text");
  const el = list[Math.min(idx, list.length-1)];
  if(el){
    el.focus();
    if(toEnd){ const n = el.value.length; el.setSelectionRange(n, n); }
  }
}
function newMemoFromEditor(){
  const memo = currentMemo();
  if(memo){
    const empty = !memo.items.some(i=> i.text.trim() || (i.result||"").trim());
    if(empty){ focusItem(0); return; }
  }
  const m = {id:uid(), labelId:null, createdAt:Date.now(), updatedAt:Date.now(),
             items:[{id:uid(), text:"", done:false, checkedAt:null, result:""}]};
  state.memos.push(m);
  save({noPush:true});
  editOpenedInApp = true;
  location.hash = "#/edit/"+m.id;
  render();
  focusItem(0);
}

/* ---------- 메모 삭제 ---------- */
function askDeleteMemo(){
  const memo = currentMemo();
  if(!memo) return;
  openSheet(`
    <h2>메모 삭제</h2>
    <div class="desc">이 할 일과 처리 기록이 삭제됩니다. (자동 스냅샷과 클라우드 이력에는 남습니다)</div>
    <div class="sheet-actions">
      <button class="btn plain" onclick="closeSheet()">취소</button>
      <button class="btn danger" onclick="deleteMemo()">삭제</button>
    </div>`);
}
function deleteMemo(){
  const id = currentId;
  const gone = state.memos.find(m=>m.id===id);
  const fallback = (gone && isTodayTs(gone.todayAt)) ? "#/today" : "#/find";
  normDeleted(state);
  state.deleted.memos[id] = Date.now();
  state.memos = state.memos.filter(m=>m.id!==id);
  save();
  closeSheet();
  if(editOpenedInApp){
    /* 뒤로 버튼과 똑같이, 메모를 열기 전에 있던 화면(오늘할일·메모찾기·첫 화면)으로 돌아간다 */
    history.back();
  }else{
    /* 앱을 이 메모 화면으로 바로 연 경우 — 뒤로 가면 앱을 벗어나므로 대신 이동 */
    location.replace(fallback);
  }
}

/* ================================================================
   라벨 시트
   ================================================================ */
function renderEditorChips(memo){
  const box = document.getElementById("editorChips");
  if(!box) return;
  const none = !memo.labelId || !state.labels.some(l=>l.id===memo.labelId);
  box.innerHTML =
    `<button class="chip${none?" on":""}" onclick="pickEditorLabel(null)">미분류</button>` +
    sortedLabels().filter(l=> !l.hidden || memo.labelId===l.id).map(l=>{
      const on = memo.labelId===l.id;
      const st = on ? ` style="color:${l.color};border-color:${l.color};background:${l.color}1A;font-weight:600"` : "";
      return `<button class="chip${on?" on":""}"${st} onclick="pickEditorLabel('${l.id}')">`+
             `<span class="cdot" style="background:${l.color}"></span>${esc(l.name)}</button>`;
    }).join("") +
    `<button class="chip" onclick="openLabelSheet()">라벨 편집</button>`;
}
function pickEditorLabel(id){
  const memo = currentMemo();
  if(!memo) return;
  /* 미분류를 누르면 라벨 해제, 같은 라벨을 다시 누르면 미분류로 */
  memo.labelId = (!id || memo.labelId===id) ? null : id;
  touch(memo);
  renderEditorChips(memo);
}

/* 라벨 편집 시트 — 한 번만 그리고 이후에는 해당 줄만 갱신(화면 깜박임 없음)
   줄 구성: 삭제 · 숨기기/보이기 · 이름 · 위치변경(끌어서 이동) */
function openLabelSheet(){
  openSheet(`
    <h2>라벨 편집</h2>
    <div class="desc">이름은 8자까지. 숨긴 라벨은 목록에서 보이지 않습니다.
    오른쪽 손잡이(≡)를 누른 채 위아래로 끌면 순서가 바뀌고, 그 순서는 모든 기기에서 같습니다.</div>
    <div id="labelRows"></div>
    <div class="label-add-row">
      <input type="text" id="newLabelInput" maxlength="8" placeholder="새 라벨 (8자 이내)"
             onkeydown="if(event.key==='Enter'){addLabel();}">
      <button class="go" onclick="addLabel()">추가</button>
    </div>
    <div class="sheet-actions">
      <button class="btn primary" onclick="closeLabelSheet()">완료</button>
    </div>`);
  buildLabelRows();
}
function buildLabelRows(){
  const box = document.getElementById("labelRows");
  if(!box) return;
  box.innerHTML = "";
  sortedLabels().forEach(l=> box.appendChild(labelRowNode(l)));
}
function labelRowNode(l){
  const row = document.createElement("div");
  row.className = "label-edit-row" + (l.hidden ? " is-hidden" : "");
  row.dataset.id = l.id;

  const del = document.createElement("button");
  del.className = "lrow-del";
  del.textContent = "삭제";
  del.onclick = ()=> askDeleteLabel(l.id);

  const hide = document.createElement("button");
  hide.className = "lrow-hide";
  hide.textContent = l.hidden ? "보이기" : "숨기기";
  hide.onclick = ()=>{
    l.hidden = !l.hidden;
    l.updatedAt = Date.now();
    save();
    hide.textContent = l.hidden ? "보이기" : "숨기기";
    row.classList.toggle("is-hidden", !!l.hidden);
  };

  const dot = document.createElement("span");
  dot.className = "cdot";
  dot.style.background = l.color;

  const inp = document.createElement("input");
  inp.type = "text"; inp.maxLength = 8; inp.value = l.name;
  inp.oninput = ()=>{ l.name = inp.value.slice(0,8); l.updatedAt = Date.now(); save(); };

  const handle = document.createElement("button");
  handle.className = "lrow-handle";
  handle.textContent = "≡";
  handle.setAttribute("aria-label", "순서 변경 — 누른 채 위아래로 끄세요");
  attachLabelDrag(handle, row);

  row.appendChild(del); row.appendChild(hide);
  row.appendChild(dot); row.appendChild(inp); row.appendChild(handle);
  return row;
}

/* ---------- 끌어서 순서 바꾸기 ---------- */
let labelDrag = null;
function attachLabelDrag(handle, row){
  handle.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    labelDrag = {row: row, box: row.parentNode, startY: e.clientY, pid: e.pointerId};
    row.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove", (e)=>{
    const d = labelDrag;
    if(!d || d.pid !== e.pointerId) return;
    e.preventDefault();
    d.row.style.transform = "translateY(" + (e.clientY - d.startY) + "px)";

    const rect = d.row.getBoundingClientRect();
    const mid = rect.top + rect.height/2;
    const prev = d.row.previousElementSibling;
    const next = d.row.nextElementSibling;
    let moved = false;
    if(prev){
      const pr = prev.getBoundingClientRect();
      if(mid < pr.top + pr.height/2){ d.box.insertBefore(d.row, prev); moved = true; }
    }
    if(!moved && next){
      const nr = next.getBoundingClientRect();
      if(mid > nr.top + nr.height/2){ d.box.insertBefore(next, d.row); moved = true; }
    }
    if(moved){
      /* 줄 위치가 바뀐 만큼 기준점을 보정해, 손가락 아래에서 그대로 따라오게 함 */
      d.startY += d.row.getBoundingClientRect().top - rect.top;
      d.row.style.transform = "translateY(" + (e.clientY - d.startY) + "px)";
    }
  });
  const end = (e)=>{
    const d = labelDrag;
    if(!d || d.pid !== e.pointerId) return;
    d.row.style.transform = "";
    d.row.classList.remove("dragging");
    labelDrag = null;
    commitLabelOrder(d.box);
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
}
function commitLabelOrder(box){
  const now = Date.now();
  let changed = false;
  Array.prototype.forEach.call(box.children, (el, i)=>{
    const l = state.labels.find(x=>x.id===el.dataset.id);
    if(l && l.order !== i){ l.order = i; l.updatedAt = now; changed = true; }
  });
  if(changed) save();
}

function closeLabelSheet(){
  closeSheet();
  /* 편집 중이면 라벨 줄만 갱신 — 화면 전체를 다시 그리면 입력 중이던 글자가 끊긴다 */
  if(isEditing()){
    const memo = currentMemo();
    if(memo) renderEditorChips(memo);
  }else{
    render(true);
  }
}
function addLabel(){
  const inp = document.getElementById("newLabelInput");
  const name = inp.value.trim().slice(0,8);
  if(!name){ inp.focus(); return; }
  const maxOrder = state.labels.reduce((m,l)=>Math.max(m, l.order||0), -1);
  const l = {id:uid(), name, updatedAt:Date.now(), color:nextLabelColor(),
             order:maxOrder+1, hidden:false};
  state.labels.push(l);
  save();
  const box = document.getElementById("labelRows");
  if(box) box.appendChild(labelRowNode(l));
  inp.value = "";
  inp.focus();
}
function askDeleteLabel(id){
  const l = state.labels.find(x=>x.id===id);
  if(!l) return;
  const used = state.memos.filter(m=>m.labelId===id).length;
  openConfirm(`
    <h2>라벨 삭제</h2>
    <div class="desc">“${esc(l.name)}” 라벨을 삭제합니다.${used?` 메모 ${used}개에서 이 라벨이 해제됩니다.`:""} 메모 자체는 지워지지 않습니다.</div>
    <div class="sheet-actions">
      <button class="btn plain" onclick="closeConfirm()">취소</button>
      <button class="btn danger" onclick="deleteLabel('${id}')">삭제</button>
    </div>`);
}
function deleteLabel(id){
  normDeleted(state);
  state.deleted.labels[id] = Date.now();
  state.labels = state.labels.filter(l=>l.id!==id);
  state.memos.forEach(m=>{ if(m.labelId===id) m.labelId=null; });
  if(filterLabel===id) filterLabel="all";
  save();
  closeConfirm();
  const box = document.getElementById("labelRows");
  if(box){
    const row = box.querySelector('[data-id="'+id+'"]');
    if(row) row.remove();
  }
}

/* ================================================================
   오늘할일 — 메모찾기에서 보낸 일들을 보낸 날짜별로 기록
   ================================================================ */
function renderToday(){
  app.innerHTML = `
    <div class="topbar">
      <button class="tb-btn" onclick="history.back()"><span class="chev">‹</span> 뒤로</button>
      <button class="tb-btn" onclick="location.replace('#/find')">메모찾기</button>
    </div>
    <div class="screen">
      <div class="find-title">오늘할일</div>
      <div id="todayList"></div>
    </div>`;
  renderTodayList();
}
function renderTodayList(){
  const box = document.getElementById("todayList");
  if(!box) return;
  const sent = state.memos.filter(m=>m.todayAt);
  if(!sent.length){
    box.innerHTML = `<div class="find-empty">아직 보낸 일이 없습니다.<br>
      메모찾기에서 각 메모 오른쪽의 <b>오늘</b> 버튼을 누르면 여기에 쌓입니다.</div>`;
    return;
  }
  /* 보낸 날짜별로 묶고, 최근 날짜가 위로 */
  const groups = {};
  sent.forEach(m=>{
    const d = new Date(m.todayAt);
    const key = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
    (groups[key] = groups[key] || []).push(m);
  });
  const keys = Object.keys(groups).map(Number).sort((a,b)=>b-a);
  let html = "";
  keys.forEach(k=>{
    const arr = groups[k];
    const doneN = arr.filter(isDoneMemo).length;
    const openArr = arr.filter(m=>!isDoneMemo(m))
                       .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const doneArr = arr.filter(isDoneMemo)
                       .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    html += `<div class="find-section">${fmtDate(arr[0].todayAt)} 보낸 일<span class="n">${doneN}/${arr.length} 완료</span></div>`;
    html += `<div class="group">` + openArr.concat(doneArr).map(todayRowHTML).join("") + `</div>`;
  });
  box.innerHTML = html;
}
function todayRowHTML(m){
  const it = m.items[0] || {text:"", done:false, checkedAt:null, result:""};
  const done = isDoneMemo(m);
  const l = state.labels.find(x=>x.id===m.labelId);
  const sub = [];
  if(l) sub.push(`<span class="lb" style="color:${l.color}">${esc(l.name)}</span>`);
  sub.push(fmtDate(m.createdAt)+" 작성");
  if(done && it.checkedAt) sub.push(fmtDate(it.checkedAt)+" 완료");
  const text = it.text.trim() ? esc(it.text) : `<span style="color:var(--sub)">빈 메모</span>`;
  const dotStyle = l ? (done ? ` style="background:${l.color};border-color:${l.color}"`
                             : ` style="border-color:${l.color}"`) : "";
  return `<div class="mrow ${done?"done":""}">
    <button class="dot tap"${dotStyle} onclick="toggleDoneToday('${m.id}')" aria-label="완료"></button>
    <span class="mrow-body" onclick="openEdit('${m.id}')">
      <div class="mrow-text">${text}</div>
      <div class="mrow-sub">${sub.join(" · ")}</div>
      ${done && (it.result||"").trim() ? `<div class="mrow-result">${esc(it.result)}</div>` : ""}
    </span>
    <button class="trm" onclick="removeFromToday('${m.id}')">빼기</button>
  </div>`;
}
/* 오늘할일 화면에서 동그라미를 눌러 바로 완료/해제 */
function toggleDoneToday(id){
  const m = state.memos.find(x=>x.id===id);
  if(!m || !m.items.length) return;
  const it = m.items[0];
  it.done = !it.done;
  it.checkedAt = it.done ? Date.now() : null;
  touch(m);
  renderTodayList();
}
function removeFromToday(id){
  const m = state.memos.find(x=>x.id===id);
  if(!m) return;
  m.todayAt = null;
  touch(m);
  renderTodayList();
}

function renderChips(){
  const box = document.getElementById("chips");
  if(!box) return;
  /* 숨긴 라벨은 목록에서 제외 (지금 보고 있는 라벨은 예외) */
  const shown = sortedLabels().filter(l=> !l.hidden || filterLabel===l.id);
  box.innerHTML =
    `<button class="chip ${filterLabel==="all"?"on":""}" onclick="setFilter('all')">전체</button>` +
    `<button class="chip ${filterLabel==="none"?"on":""}" onclick="setFilter('none')">미분류</button>` +
    shown.map(l=>{
      const on = filterLabel===l.id;
      const st = on ? ` style="color:${l.color};border-color:${l.color};background:${l.color}1A;font-weight:600"` : "";
      return `<button class="chip${on?" on":""}"${st} onclick="setFilter('${l.id}')">`+
             `<span class="cdot" style="background:${l.color}"></span>${esc(l.name)}</button>`;
    }).join("") +
    `<button class="chip" onclick="openLabelSheet()">라벨 편집</button>`;
}

function memoMatches(m, q){
  if(!q) return true;
  if((labelName(m.labelId)||"").toLowerCase().includes(q)) return true;
  return m.items.some(i=>
    i.text.toLowerCase().includes(q) || (i.result||"").toLowerCase().includes(q));
}

function toggleHidden(){ showHidden = !showHidden; renderResults(); }

function renderResults(){
  const box = document.getElementById("findResults");
  if(!box) return;
  const q = searchQ.trim().toLowerCase();
  let memos = state.memos.slice();
  if(filterLabel==="none") memos = memos.filter(m=>!m.labelId || !state.labels.some(l=>l.id===m.labelId));
  else if(filterLabel!=="all") memos = memos.filter(m=>m.labelId===filterLabel);
  memos = memos.filter(m=>memoMatches(m, q));
  /* 작성일(내용을 고치면 고친 날로 바뀜) 최신순 — 오늘 보내기·체크로는 자리가 안 바뀐다 */
  memos.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  const open = memos.filter(m=>!isDoneMemo(m));
  const done = memos.filter(isDoneMemo);
  /* 완료 메모는 기본 숨김 — 검색 중이거나 '숨긴 메모 보기'를 켰을 때만 표시 */
  const revealDone = q ? true : showHidden;

  if(!open.length && !(revealDone && done.length)){
    let html = `<div class="find-empty">${q || filterLabel!=="all"
      ? "조건에 맞는 메모가 없습니다."
      : "진행 중인 메모가 없습니다.<br>첫 화면의 메모하기에서 시작해 보세요."}</div>`;
    if(!q && done.length){
      html += `<button class="reveal-btn" onclick="toggleHidden()">숨긴 메모 ${done.length}개 보기</button>`;
    }
    box.innerHTML = html;
    return;
  }
  let html = "";
  if(open.length){
    html += `<div class="find-section">진행 중<span class="n">${open.length}</span></div>`;
    html += `<div class="group">` + open.map(rowHTML).join("") + `</div>`;
  }
  if(revealDone && done.length){
    html += `<div class="find-section">완료<span class="n">${done.length}</span></div>`;
    html += `<div class="group">` + done.map(rowHTML).join("") + `</div>`;
  }
  if(!q && done.length){
    html += `<button class="reveal-btn" onclick="toggleHidden()">${showHidden
      ? "숨긴 메모 가리기"
      : "숨긴 메모 "+done.length+"개 보기"}</button>`;
  }
  box.innerHTML = html;
}

function rowHTML(m){
  const it = m.items[0] || {text:"", done:false, checkedAt:null, result:""};
  const done = isDoneMemo(m);
  const l = state.labels.find(x=>x.id===m.labelId);
  const sub = [];
  if(l) sub.push(`<span class="lb" style="color:${l.color}">${esc(l.name)}</span>`);
  sub.push(fmtDate(m.createdAt)+" 작성");
  if(done && it.checkedAt) sub.push(fmtDate(it.checkedAt)+" 완료");
  const text = it.text.trim() ? esc(it.text) : `<span style="color:var(--sub)">빈 메모</span>`;
  const dotStyle = l ? (done ? ` style="background:${l.color};border-color:${l.color}"`
                             : ` style="border-color:${l.color}"`) : "";
  const todayBtn = done ? "" :
    `<button class="today-btn${isTodayTs(m.todayAt)?" on":""}"
             onclick="event.stopPropagation();toggleToday('${m.id}')">오늘</button>`;
  return `<div class="mrow ${done?"done":""}" onclick="openEdit('${m.id}')">
    <span class="dot"${dotStyle}></span>
    <span class="mrow-body">
      <div class="mrow-text">${text}</div>
      <div class="mrow-sub">${sub.join(" · ")}</div>
      ${done && (it.result||"").trim() ? `<div class="mrow-result">${esc(it.result)}</div>` : ""}
    </span>
    ${todayBtn}
  </div>`;
}

/* 메모찾기에서 오늘할일로 보내기/빼기 */
function toggleToday(id){
  const m = state.memos.find(x=>x.id===id);
  if(!m) return;
  m.todayAt = isTodayTs(m.todayAt) ? null : Date.now();
  touch(m);
  renderResults();
}

/* ================================================================
   2중 보관 — 파일 백업 + 자동 스냅샷
   ================================================================ */
function openVault(){
  const snaps = snapKeys().map(k=>{
    let at = 0;
    try{ at = (JSON.parse(localStorage.getItem(k))||{}).at || 0; }catch(e){}
    return `<div class="snap-row">
      <span class="t">${fmtTime(at) || "저장본"}<small>${lostInSnap(k).length
        ? "지금 없는 메모 "+lostInSnap(k).length+"개 있음" : "자동 스냅샷"}</small></span>
      <button class="go" onclick="openSnapBrowse('${k}')">살펴보기</button>
    </div>`;
  }).join("");
  openSheet(`
    <h2>데이터 보관</h2>
    <div class="desc">메모는 이 기기에 즉시 저장되고, 하루 1회 자동 스냅샷(최근 7일)이 함께 보관됩니다.
    사라진 메모가 있으면 아래 스냅샷을 <b>살펴보기</b>로 열어 하나씩 되살릴 수 있습니다.</div>
    <div class="tool-list">
      <button class="tool-btn" onclick="exportData()">백업 파일 내려받기</button>
      <button class="tool-btn" onclick="document.getElementById('importFile').click()">백업 파일 불러오기</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)">
    </div>
    ${snaps ? `<div class="desc" style="margin:16px 0 4px"><b>자동 스냅샷</b></div>${snaps}` : ""}
    <div class="sheet-actions">
      <button class="btn primary" onclick="closeSheet()">닫기</button>
    </div>`);
}

/* 스냅샷에는 내용이 있는데 지금은 없는(또는 내용이 줄어든) 메모를 찾아낸다 */
function lostInSnap(key){
  let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(key)); }catch(e){}
  if(!snap || !snap.data || !Array.isArray(snap.data.memos)) return [];
  const now = {};
  state.memos.forEach(m=>{
    now[m.id] = (m.items||[]).map(i=>(i.text||"")+(i.result||"")).join("").trim();
  });
  return snap.data.memos.filter(m=>{
    const body = (m.items||[]).map(i=>(i.text||"")+(i.result||"")).join("").trim();
    if(!body) return false;                  /* 스냅샷에서도 비어 있으면 볼 것 없음 */
    const cur = now[m.id];
    if(cur === undefined) return true;       /* 지금은 아예 없는 메모 */
    return cur.length < body.length;         /* 지금은 내용이 줄어든 메모 */
  });
}

function openSnapBrowse(key){
  let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(key)); }catch(e){}
  if(!snap || !snap.data) return;
  const lost = lostInSnap(key).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const rows = lost.map(m=>{
    const it = (m.items||[])[0] || {text:"", result:""};
    const body = (it.text||"").trim() || (it.result||"").trim();
    return `<div class="snap-row">
      <span class="t">${esc(body.slice(0,60))}${body.length>60?"…":""}
        <small>${fmtTime(m.createdAt)} 작성</small></span>
      <button class="go" onclick="recoverMemo('${key}','${m.id}')">되살리기</button>
    </div>`;
  }).join("");
  openSheet(`
    <h2>${fmtTime(snap.at)} 저장본</h2>
    <div class="desc">${lost.length
      ? "이 저장본에는 있는데 <b>지금은 없는 메모</b>입니다. 하나씩 되살릴 수 있고, 지금 있는 메모는 그대로 유지됩니다."
      : "이 저장본에는 지금 없는 메모가 없습니다. 되살릴 것이 없습니다."}</div>
    ${rows}
    <div class="sheet-foot">
      <button class="quiet" onclick="askRestoreSnap('${key}')">이 시점 전체로 되돌리기</button>
      <span></span>
    </div>
    <div class="sheet-actions">
      <button class="btn plain" onclick="openVault()">뒤로</button>
      <button class="btn primary" onclick="closeSheet()">닫기</button>
    </div>`);
}

/* 스냅샷의 메모 하나만 되살린다 (다른 메모는 건드리지 않음) */
function recoverMemo(key, id){
  let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(key)); }catch(e){}
  if(!snap || !snap.data) return;
  const src = (snap.data.memos||[]).find(m=>m.id===id);
  if(!src) return;
  normDeleted(state);
  delete state.deleted.memos[id];      /* 삭제 기록을 지워야 동기화로 다시 사라지지 않음 */
  const copy = JSON.parse(JSON.stringify(src));
  copy.updatedAt = Date.now();         /* 병합에서 이기도록 방금 편집한 것으로 표시 */
  if(hasBody(copy)) copy.everHadBody = true;
  if(copy.labelId && !state.labels.some(l=>l.id===copy.labelId)) copy.labelId = null;
  const idx = state.memos.findIndex(m=>m.id===id);
  if(idx >= 0) state.memos[idx] = copy; else state.memos.push(copy);
  save();
  openSnapBrowse(key);
}

function dailySnapshot(){
  const d = new Date();
  const k = SNAP + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
  if(!localStorage.getItem(k)){
    try{ localStorage.setItem(k, JSON.stringify({at:Date.now(), data:state})); }catch(e){}
  }
  pruneSnaps();
}
function snapKeys(){
  const ks = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SNAP)===0) ks.push(k);
  }
  return ks.sort().reverse();
}
function pruneSnaps(){ snapKeys().slice(7).forEach(k=>localStorage.removeItem(k)); }
function askRestoreSnap(key){
  let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(key)); }catch(e){}
  if(!snap || !snap.data){ return; }
  openSheet(`
    <h2>전체 되돌리기</h2>
    <div class="desc">현재 데이터를 통째로 <b>${fmtTime(snap.at)}</b> 시점으로 되돌립니다.
    그 이후에 쓰신 메모는 사라집니다. 메모 하나만 되살리려면 <b>살펴보기</b>에서 되살리기를 쓰세요.</div>
    <div class="sheet-actions">
      <button class="btn plain" onclick="openSnapBrowse('${key}')">취소</button>
      <button class="btn danger" id="restoreGo">되돌리기</button>
    </div>`);
  document.getElementById("restoreGo").onclick = ()=>{
    /* 되돌리기 직전 상태를 먼저 스냅샷으로 남긴다 — 언제든 취소 가능하게 */
    try{ localStorage.setItem(SNAP+"복원전"+Date.now(), JSON.stringify({at:Date.now(), data:state})); }catch(e){}
    pruneSnaps();
    state = normDeleted(snap.data);
    /* 복원본이 병합에서 밀리지 않도록 전부 '방금 편집한 것'으로 표시 */
    const now = Date.now();
    state.labels.forEach(l=>l.updatedAt = now);
    state.memos.forEach(m=>m.updatedAt = now);
    state.deleted = {labels:{}, memos:{}};
    save({noPush:true});
    migrateSingle();
    assignColors();
    assignOrder();
    closeSheet();
    render(true);
    /* 클라우드를 덮어쓰지 않도록, 올리기 전에 먼저 내려받아 합친다.
       스냅샷 이후에 쓴 메모도 클라우드에서 합쳐져 돌아온다. */
    if(syncCfg && syncCfg.gistId){ manualSync(); }
  };
}
function exportData(){
  const d = new Date();
  const name = "할일메모백업_"+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+".json";
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(inp){
  const f = inp.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(!Array.isArray(d.labels) || !Array.isArray(d.memos)) throw new Error("bad");
      openSheet(`
        <h2>백업 복원</h2>
        <div class="desc">현재 데이터를 백업 파일 내용(라벨 ${d.labels.length}개, 메모 ${d.memos.length}개)으로 완전히 교체합니다.</div>
        <div class="sheet-actions">
          <button class="btn plain" onclick="closeSheet()">취소</button>
          <button class="btn danger" id="importGo">교체</button>
        </div>`);
      document.getElementById("importGo").onclick = ()=>{
        state = normDeleted(d);
        const now = Date.now();
        state.labels.forEach(l=>l.updatedAt = now);
        state.memos.forEach(m=>m.updatedAt = now);
        state.deleted = {labels:{}, memos:{}};
        save(); migrateSingle(); assignColors(); assignOrder(); closeSheet(); render(true);
      };
    }catch(e){
      openSheet(`
        <h2>복원 실패</h2>
        <div class="desc">이 파일은 할 일 메모 백업 파일이 아닙니다. '백업 파일 내려받기'로 만든 .json 파일을 선택해 주세요.</div>
        <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">확인</button></div>`);
    }
  };
  reader.readAsText(f);
  inp.value = "";
}

/* ================================================================
   3중 보관 — GitHub 비공개 Gist 클라우드 동기화
   ================================================================ */
let syncCfg = (function(){
  try{
    const d = JSON.parse(localStorage.getItem(SYNC_KEY));
    if(d && d.token && d.gistId) return d;
  }catch(e){}
  return null;
})();
let syncStatus = syncCfg ? "동기화 확인 중…" : "";
let pushTimer = null, pushing = false, pendingPush = false;

/* ---------- 미전송 변경 추적 ----------
   이 기기에서 바뀌었지만 아직 클라우드에 안 올라간 변경이 있는지 기억한다.
   앱을 껐다 켜도 유지되도록 localStorage에 보관. */
const DIRTY_KEY = "memo-todo-dirty";
let dirtySeq = 0, lastPushFailed = false;
let dirtySince = (function(){ try{ return +localStorage.getItem(DIRTY_KEY) || 0; }catch(e){ return 0; } })();
function setDirty(on){
  if(on){
    if(!dirtySince){
      dirtySince = Date.now();
      try{ localStorage.setItem(DIRTY_KEY, String(dirtySince)); }catch(e){}
    }
  }else if(dirtySince){
    dirtySince = 0;
    try{ localStorage.removeItem(DIRTY_KEY); }catch(e){}
  }
  renderSyncBadges();
}
function renderSyncBadges(){
  const eb = document.getElementById("editSync");
  if(eb){
    if(!syncCfg || !syncCfg.gistId){ eb.textContent = ""; eb.className = "sync-badge"; }
    else if(dirtySince){ eb.textContent = "전송 대기"; eb.className = "sync-badge wait"; }
    else { eb.textContent = "클라우드 저장됨"; eb.className = "sync-badge ok"; }
  }
  const hd = document.getElementById("homeDirty");
  if(hd){
    const stale = dirtySince && (lastPushFailed || Date.now() - dirtySince > 15000);
    hd.textContent = (syncCfg && syncCfg.gistId && stale)
      ? "아직 클라우드에 안 올라간 변경이 있습니다. 인터넷이 연결되면 자동으로 올립니다."
      : "";
  }
}
/* 클라우드로 보낼 데이터 — 내용이 없는 빈 메모는 보내지 않는다 */
function payloadJSON(){
  return JSON.stringify(Object.assign({}, state, {memos: state.memos.filter(hasBody)}));
}

function saveSyncCfg(){ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }
function setStatus(s){
  syncStatus = s;
  const el = document.getElementById("syncStatusBox");
  if(el) el.textContent = s;
  const hf = document.getElementById("homeSyncLine");
  if(hf) hf.textContent = syncCfg ? s : "";
}

let lastScopes = null;   /* 마지막 응답의 토큰 권한 목록 (X-OAuth-Scopes) */
async function gh(path, opts){
  opts = opts || {};
  const headers = {
    "Authorization": "Bearer " + syncCfg.token,
    "Accept": "application/vnd.github+json"
  };
  if(opts.body) headers["Content-Type"] = "application/json";
  const ctrl = new AbortController();
  const tm = setTimeout(()=>ctrl.abort(), 15000);
  let res;
  try{
    res = await fetch("https://api.github.com"+path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body || undefined,
      keepalive: !!opts.keepalive,
      signal: ctrl.signal
    });
  }finally{ clearTimeout(tm); }
  const sc = res.headers.get("x-oauth-scopes");
  if(sc !== null) lastScopes = sc;
  if(!res.ok){
    const err = new Error("http "+res.status);
    err.status = res.status;
    throw err;
  }
  return res.json();
}
function hasGistScope(){
  if(lastScopes === null) return true;   /* 헤더를 못 읽는 환경이면 판단 보류 */
  return lastScopes.split(",").map(s=>s.trim()).indexOf("gist") !== -1;
}

/* 실패 원인을 사람이 읽을 수 있는 문장으로 */
function syncErrText(e){
  if(e && e.status===401) return "토큰이 올바르지 않습니다(오타·만료·삭제됨). ghp_로 시작하는 classic 토큰으로 다시 연결해 주세요.";
  if(e && e.status===403) return "토큰에 gist 권한이 없습니다. 토큰을 만들 때 gist 항목을 체크해야 합니다.";
  if(e && e.status===404) return "클라우드 저장소에 접근할 수 없습니다. 토큰에 gist 권한이 있는지 확인하고 다시 연결해 주세요.";
  if(e && e.status) return "GitHub 응답 오류("+e.status+") — 잠시 후 다시 시도해 주세요.";
  return "인터넷 연결을 확인해 주세요.";
}
function syncErrShort(e){
  if(e && e.status===401) return "토큰이 만료·삭제됨 — 동기화에서 새 토큰으로 연결하세요";
  if(e && e.status===403) return "토큰 권한(gist) 없음 — 동기화에서 새 토큰으로 연결하세요";
  if(e && e.status===404) return "저장소 접근 불가 — 동기화에서 새 토큰으로 연결하세요";
  if(e && e.status) return "GitHub 오류("+e.status+") — 나중에 다시 시도합니다";
  return "오프라인 — 연결되면 자동 동기화됩니다";
}

/* ---------- 병합 동기화 ----------
   기기 간 데이터를 통째로 교체하지 않고 합친다.
   - 라벨·메모는 합집합, 같은 항목은 더 최근에 편집한 쪽 유지
   - 삭제 기록(deleted)을 함께 동기화해, 한쪽에서 지운 것이 다른 쪽에서 되살아나지 않게 함
   - 빈 기기가 데이터 있는 기기를 덮어쓰는 일이 구조적으로 불가능 */
function normDeleted(s){
  if(!s.deleted || typeof s.deleted !== "object") s.deleted = {labels:{}, memos:{}};
  if(!s.deleted.labels) s.deleted.labels = {};
  if(!s.deleted.memos) s.deleted.memos = {};
  return s;
}
function mergeStates(a, b){
  normDeleted(a); normDeleted(b);
  const deleted = {labels:{}, memos:{}};
  ["labels","memos"].forEach(t=>{
    [a.deleted[t], b.deleted[t]].forEach(src=>{
      Object.keys(src).forEach(id=>{
        deleted[t][id] = Math.max(deleted[t][id]||0, src[id]||0);
      });
    });
  });

  /* 라벨: id로 병합(최근 이름 우선), 같은 이름의 다른 id는 하나로 통합 */
  const labels = [];
  const remap = {};
  [].concat(a.labels, b.labels).forEach(l=>{
    const ex = labels.find(x=>x.id===l.id);
    if(ex){
      if((l.updatedAt||0) > (ex.updatedAt||0)){
        ex.name = l.name; ex.updatedAt = l.updatedAt||0;
        ex.hidden = !!l.hidden;
        if(l.color) ex.color = l.color;
        if(l.order!=null) ex.order = l.order;
      }else{
        if(!ex.color && l.color) ex.color = l.color;
        if(ex.order==null && l.order!=null) ex.order = l.order;
      }
      return;
    }
    const byName = labels.find(x=>x.name===l.name);
    if(byName){
      remap[l.id] = byName.id;
      if(!byName.color && l.color) byName.color = l.color;
      if(byName.order==null && l.order!=null) byName.order = l.order;
      return;
    }
    labels.push({id:l.id, name:l.name, updatedAt:l.updatedAt||0, color:l.color,
                 order:l.order, hidden:!!l.hidden});
  });

  /* 메모: id로 병합, 더 최근에 편집한 쪽 유지 ('내용이 있었던 메모' 표시는 양쪽 중 하나라도 있으면 유지) */
  const byId = {};
  [].concat(a.memos, b.memos).forEach(m=>{
    const ex = byId[m.id];
    if(!ex || (m.updatedAt||0) > (ex.updatedAt||0)){
      if(ex && (ex.everHadBody || hasBody(ex))) m.everHadBody = true;
      byId[m.id] = m;
    }else if(m.everHadBody || hasBody(m)){
      ex.everHadBody = true;
    }
  });

  /* 삭제 기록 적용: 삭제 시각이 마지막 편집보다 나중이면 제거,
     그 후에 다시 편집된 항목은 되살리고 삭제 기록을 해제 */
  const finalLabels = labels.filter(l=>{
    const dts = deleted.labels[l.id];
    if(dts && dts > (l.updatedAt||0)) return false;
    if(dts) delete deleted.labels[l.id];
    return true;
  });
  const memos = [];
  Object.keys(byId).forEach(k=>{
    const m = byId[k];
    const dts = deleted.memos[m.id];
    if(dts && dts > (m.updatedAt||0)) return;
    if(dts) delete deleted.memos[m.id];
    if(m.labelId && remap[m.labelId]) m.labelId = remap[m.labelId];
    if(m.labelId && !finalLabels.some(l=>l.id===m.labelId)) m.labelId = null;
    memos.push(m);
  });
  memos.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));

  /* 90일 지난 삭제 기록은 정리 */
  const cutoff = Date.now() - 90*24*3600*1000;
  ["labels","memos"].forEach(t=>{
    Object.keys(deleted[t]).forEach(id=>{ if(deleted[t][id] < cutoff) delete deleted[t][id]; });
  });

  return {labels:finalLabels, memos:memos, deleted:deleted,
          savedAt: Math.max(a.savedAt||0, b.savedAt||0)};
}
function sig(s){
  normDeleted(s);
  return JSON.stringify({
    l: s.labels.map(x=>x.id+":"+x.name+":"+(x.color||"")+":"+
         (x.order==null?"":x.order)+":"+(x.hidden?1:0)).sort(),
    m: s.memos.filter(hasBody).map(x=>JSON.stringify([x.id, x.labelId||null, x.todayAt||0,
         x.items.map(i=>[i.id, i.text, i.done?1:0, i.checkedAt||0, i.result||""])])).sort(),
    dl: Object.keys(s.deleted.labels).sort().map(k=>k+":"+s.deleted.labels[k]).join(","),
    dm: Object.keys(s.deleted.memos).sort().map(k=>k+":"+s.deleted.memos[k]).join(",")
  });
}

/* 계정에서 동기화 저장소를 찾고, 없으면 새로 만든다 */
async function ensureGist(){
  const gists = await gh("/gists?per_page=100");
  const found = gists.find(g=>g.description===GIST_DESC);
  if(found){
    syncCfg.gistId = found.id;
  }else{
    const g = await gh("/gists", {method:"POST", body:JSON.stringify({
      description: GIST_DESC, public: false,
      files: {[GIST_FILE]: {content: payloadJSON()}}
    })});
    syncCfg.gistId = g.id;
    syncCfg.lastPushAt = Date.now();
  }
  saveSyncCfg();
}

async function connectSync(token){
  syncCfg = {token: token};
  await ensureGist();
  /* gist 권한 없는 토큰은 읽기만 되고 업로드가 전부 실패하므로 연결 자체를 거절 */
  if(!hasGistScope()){
    const err = new Error("no gist scope");
    err.status = 403;
    throw err;
  }
  await pullRemote();
  setStatus("동기화됨 · "+fmtTime(Date.now()));
}

/* ---------- 연결 진단 ---------- */
async function runDiag(){
  const box = document.getElementById("diagBox");
  if(!box || !syncCfg) return;
  const lines = [];
  const show = ()=>{ box.innerHTML = "<b>진단 결과</b><br>" + lines.join("<br>"); };
  lines.push("진단 중…"); show(); lines.length = 0;

  lines.push(syncCfg.token.indexOf("ghp_")===0
    ? "1. 토큰 형식: 정상 (classic)"
    : "1. 토큰 형식: 비정상 — classic(ghp_) 토큰이 아닙니다");
  try{
    const u = await gh("/user");
    lines.push("2. 토큰 유효성: 정상 (계정 "+esc(u.login)+")");
    lines.push(hasGistScope()
      ? "3. gist 권한: 있음"
      : "3. gist 권한: 없음 — 이게 원인입니다. 새 토큰을 만들 때 gist를 체크하세요");
  }catch(e){
    lines.push("2. 토큰 유효성: 실패 — "+syncErrText(e));
    show(); return;
  }
  try{
    const g = await gh("/gists/"+syncCfg.gistId);
    lines.push("4. 저장소 읽기: 정상 (마지막 수정 "+fmtTime(new Date(g.updated_at).getTime())+")");
  }catch(e){
    lines.push("4. 저장소 읽기: 실패 — "+syncErrText(e));
  }
  try{
    await gh("/gists/"+syncCfg.gistId, {method:"PATCH",
      body: JSON.stringify({files:{[GIST_FILE]:{content: payloadJSON()}}})});
    syncCfg.lastPushAt = Date.now();
    saveSyncCfg();
    lastPushFailed = false;
    setDirty(false);
    setStatus("동기화됨 · "+fmtTime(syncCfg.lastPushAt));
    lines.push("5. 업로드 시험: 성공 — 동기화가 정상 동작합니다");
  }catch(e){
    lines.push("5. 업로드 시험: 실패 — "+syncErrText(e));
  }
  show();
}

async function pullRemote(){
  let g;
  try{
    g = await gh("/gists/"+syncCfg.gistId);
  }catch(e){
    /* 저장된 id로 접근 불가(404) → 자동으로 다시 찾거나 재생성 후 재시도 */
    if(e.status===404){ await ensureGist(); g = await gh("/gists/"+syncCfg.gistId); }
    else throw e;
  }
  const f = g.files[GIST_FILE];
  if(!f) return;
  let text = f.content;
  if(f.truncated){
    const r = await fetch(f.raw_url);
    text = await r.text();
  }
  let remote = null;
  try{ remote = JSON.parse(text); }catch(e){}
  if(!remote || !Array.isArray(remote.memos) || !Array.isArray(remote.labels)) return;

  /* 클라우드에 있는 빈 메모 껍데기(구버전 기기가 올린 것)는 이 기기에 없으면 받지 않는다 */
  const localIds = {};
  state.memos.forEach(m=>{ localIds[m.id] = true; });
  remote.memos = remote.memos.filter(m=> hasBody(m) || localIds[m.id]);

  const merged = mergeStates(state, remote);
  const localChanged  = sig(merged) !== sig(state);
  const remoteChanged = sig(merged) !== sig(remote);

  if(localChanged){
    /* 병합으로 이 기기 화면이 달라질 때만, 이전 상태를 스냅샷으로 남김 */
    try{ localStorage.setItem(SNAP+"병합전"+Date.now(), JSON.stringify({at:Date.now(), data:state})); }catch(e){}
    pruneSnaps();
    state = merged;
    save({noPush:true, keepStamp:true});
    migrateSingle();
    markBodies();
    pruneEmptyShells();
    assignColors();
    assignOrder();
    /* 메모를 쓰고 있는 중이면 화면을 다시 그리지 않는다.
       (다시 그리면 입력칸이 새로 만들어져 키보드 포커스와 조합 중인 글자가 날아간다) */
    if(!isEditing()) render(true);
  }else{
    state = merged;
    save({noPush:true, keepStamp:true});
    migrateSingle();
    markBodies();
    pruneEmptyShells();
    assignColors();
    assignOrder();
  }
  if(remoteChanged){
    schedulePush(400);
  }
  syncCfg.lastPullAt = Date.now();
  saveSyncCfg();
  setStatus("동기화됨 · "+fmtTime(Date.now()));
}

function schedulePush(delay){
  if(!syncCfg || !syncCfg.gistId) return;
  dirtySeq++;
  setDirty(true);
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, delay==null ? 2500 : delay);
  setStatus("저장됨 · 동기화 대기");
}
async function doPush(opts){
  if(!syncCfg || !syncCfg.gistId) return;
  if(pushing){ pendingPush = true; return; }
  pushing = true;
  pushTimer = null;
  const seq = dirtySeq;
  const patch = ()=> gh("/gists/"+syncCfg.gistId, {method:"PATCH",
    keepalive: !!(opts && opts.keepalive),
    body: JSON.stringify({files:{[GIST_FILE]:{content: payloadJSON()}}})});
  try{
    setStatus("동기화 중…");
    try{
      await patch();
    }catch(e){
      if(e.status===404){ await ensureGist(); await patch(); }
      else throw e;
    }
    syncCfg.lastPushAt = Date.now();
    saveSyncCfg();
    lastPushFailed = false;
    /* 올리는 동안 새 변경이 없었을 때만 '전송 완료'로 표시 */
    if(dirtySeq === seq) setDirty(false);
    setStatus("동기화됨 · "+fmtTime(syncCfg.lastPushAt));
  }catch(e){
    lastPushFailed = true;
    renderSyncBadges();
    setStatus(syncErrShort(e));
  }
  pushing = false;
  if(pendingPush){ pendingPush = false; schedulePush(500); }
}

/* 앱을 열거나 다시 돌아왔을 때: 클라우드와 합친 다음, 안 올라간 변경이 있으면 바로 올린다.
   (먼저 올리기부터 하면 파일 전체를 덮어써 다른 기기의 변경을 밀어낼 수 있어서 '합치고 → 즉시 올리기' 순서) */
let resumeBusy = false, lastResumeAt = 0;
async function syncOnResume(){
  if(!syncCfg || !syncCfg.gistId || resumeBusy) return;
  if(Date.now() - lastResumeAt < 8000) return;
  resumeBusy = true;
  lastResumeAt = Date.now();
  try{
    await pullRemote();
    if(dirtySince && !pushing){ clearTimeout(pushTimer); await doPush(); }
  }catch(e){
    lastPushFailed = !!dirtySince;
    renderSyncBadges();
    setStatus(syncErrShort(e));
  }
  resumeBusy = false;
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden"){
    if(pushTimer){ clearTimeout(pushTimer); doPush({keepalive:true}); }
  }else{
    syncOnResume();
  }
});
window.addEventListener("online", ()=>{ lastResumeAt = 0; syncOnResume(); });

async function connectFromSheet(){
  const inp = document.getElementById("tokenInput");
  const tk = (inp.value||"").trim();
  if(!tk){ inp.focus(); return; }
  const errEl = document.getElementById("syncErr");
  if(tk.indexOf("github_pat_")===0){
    if(errEl) errEl.textContent = "이 토큰은 Fine-grained 종류라 사용할 수 없습니다. classic 토큰(ghp_로 시작)을 만들어 주세요.";
    return;
  }
  const btn = document.getElementById("connectBtn");
  btn.textContent = "연결 중…";
  try{
    await connectSync(tk);
    openSyncSheet();
    render(true);
  }catch(e){
    syncCfg = null;
    localStorage.removeItem(SYNC_KEY);
    const el = document.getElementById("syncErr");
    if(el) el.textContent = syncErrText(e);
    btn.textContent = "연결";
  }
}
async function manualSync(){
  try{
    setStatus("동기화 중…");
    await pullRemote();
    await doPush();
  }catch(e){
    setStatus(syncErrShort(e));
  }
}
function disconnectSync(){
  syncCfg = null;
  localStorage.removeItem(SYNC_KEY);
  setStatus("");
  closeSheet();
  render(true);
}

function adjustBar(){
  const bar = document.getElementById("editorBar");
  if(!bar || !window.visualViewport) return;
  const vv = window.visualViewport;
  const overlap = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  bar.style.transform = overlap ? "translateY(-"+overlap+"px)" : "";
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", adjustBar);
  window.visualViewport.addEventListener("scroll", adjustBar);
}

/* ---------- 앱 업데이트 ----------
   새 버전이 배포되면 앱이 스스로 알아채고 한 번 새로고침한다.
   메모를 쓰는 중이면 기다렸다가 편집 화면을 나갈 때 새로고침(쓰던 글은 이미 저장돼 있음). */
let swReg = null, reloadPending = false, reloadedOnce = false;
function applyUpdateReload(){
  if(reloadedOnce) return;
  if(isEditing()){ reloadPending = true; return; }
  /* 지금 화면이 이미 서버의 최신 버전이면 새로고침하지 않는다 */
  fetch("./", {cache:"no-store"})
    .then(r=>r.text())
    .then(t=>{
      const m = t.match(/const APP_VERSION = "([^"]+)"/);
      if(m && m[1] === APP_VERSION) return;
      reloadedOnce = true;
      location.reload();
    })
    .catch(()=>{});
}
if("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    /* 처음 설치될 때는 새로고침할 필요 없음 — 업데이트로 교체될 때만 */
    if(hadController) applyUpdateReload();
  });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js", {updateViaCache: "none"})
      .then(reg=>{ swReg = reg; reg.update().catch(()=>{}); })
      .catch(()=>{});
  });
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible" && swReg) swReg.update().catch(()=>{});
  });
}
window.addEventListener("hashchange", ()=>{
  if(reloadPending && !isEditing()){ reloadPending = false; applyUpdateReload(); }
});

/* ---------- 시작 ---------- */
/* 예전 구조(메모 하나에 할 일 여러 개)를 할 일 1개짜리 메모들로 분리.
   분리된 id가 기기마다 동일하도록 원본 id에서 파생시켜 동기화 중복을 막는다. */
function migrateSingle(){
  normDeleted(state);
  let changed = false;
  const out = [];
  state.memos.forEach(m=>{
    const texted = m.items.filter(i=> (i.text||"").trim() || (i.result||"").trim());
    if(texted.length > 1){
      texted.forEach(it=>{
        out.push({id: m.id+"_"+it.id, labelId:m.labelId, createdAt:m.createdAt,
                  updatedAt:m.updatedAt||m.createdAt||0, items:[it]});
      });
      state.deleted.memos[m.id] = Date.now();
      changed = true;
    }else{
      if(m.items.length > 1){
        m.items = [texted[0] || m.items[0]];
        changed = true;
      }
      out.push(m);
    }
  });
  if(changed){
    state.memos = out;
    save({keepStamp:true});
  }
  return changed;
}

save({noPush:true, keepStamp:true});
migrateSingle();
markBodies();
dailySnapshot();          /* 빈 메모 정리 전에 오늘 스냅샷을 먼저 남긴다 */
pruneEmptyShells();
assignColors();
assignOrder();
render();
syncOnResume();
</script>
