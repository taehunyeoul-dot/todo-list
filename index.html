<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="할일메모">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF3FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1420">
<title>할 일 메모</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
  :root{
    --bg:#EEF3FA; --surface:#FFFFFF; --ink:#1B2536; --sub:#8792A2;
    --line:rgba(27,37,54,.1); --accent:#2160C4; --accent-soft:rgba(33,96,196,.08);
    --danger:#BE3B3B; --chk-check:#FFFFFF; --press:rgba(27,37,54,.05);
    --dim:rgba(15,20,32,.45); --field:#E4EBF5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1420; --surface:#1A2130; --ink:#EEF2F8; --sub:#8E99AD;
      --line:rgba(238,242,248,.12); --accent:#7CA9F2; --accent-soft:rgba(124,169,242,.13);
      --danger:#E2685F; --chk-check:#0F1420; --press:rgba(238,242,248,.06);
      --dim:rgba(0,0,0,.55); --field:#242E42;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    position:fixed; inset:0; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;color:var(--ink);}
  button{
    font-family:inherit; background:none; border:none; color:var(--ink);
    font-size:17px; cursor:pointer; touch-action:manipulation; padding:0;
  }
  button:active{opacity:.55;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

  #app{position:absolute;inset:0;display:flex;flex-direction:column;}

  /* ===== 상단 바 ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 18px 8px;
    min-height:44px;flex-shrink:0;
  }
  .tb-btn{font-size:16px;color:var(--accent);letter-spacing:-.2px;}
  .tb-btn.danger{color:var(--danger);}
  .tb-btn .chev{font-size:22px;line-height:1;vertical-align:-2px;margin-right:1px;}

  .screen{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;overflow-x:hidden;
    padding:0 18px calc(40px + env(safe-area-inset-bottom));
  }

  /* ===== 첫 화면 ===== */
  .home{flex:1;display:flex;flex-direction:column;}
  .home-mark{
    text-align:center;font-size:13px;letter-spacing:.28em;color:var(--sub);
    padding:calc(26px + env(safe-area-inset-top)) 0 6px;
  }
  .home-panel{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center;
  }
  .home-panel:active{background:var(--press);opacity:1;}
  .hp-title{font-size:34px;font-weight:700;letter-spacing:-.5px;}
  .hp-sub{font-size:14px;color:var(--sub);letter-spacing:-.1px;}
  .home-hr{height:1px;background:var(--line);margin:0 34px;flex-shrink:0;}
  .home-foot{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 0 calc(20px + env(safe-area-inset-bottom));
  }
  .home-foot-row{display:flex;justify-content:center;align-items:center;gap:11px;color:var(--sub);}
  .home-foot button{font-size:13px;color:var(--sub);}
  .home-foot .sep{font-size:11px;}
  .home-sync{font-size:12px;color:var(--accent);min-height:15px;}

  /* ===== 메모하기 (편집) ===== */
  .memo-meta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:2px 2px 16px;
  }
  .memo-meta .when{font-size:13px;color:var(--sub);letter-spacing:-.1px;}
  .label-chip{
    font-size:13px;color:var(--accent);background:var(--accent-soft);
    padding:5px 12px;border-radius:999px;max-width:55%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .label-chip.empty{color:var(--sub);background:transparent;border:1px dashed var(--line);}

  .item{display:flex;align-items:flex-start;gap:12px;padding:9px 0;}
  .chk{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;margin-top:2px;
    border:1.5px solid var(--sub);background:transparent;position:relative;
  }
  .item.done .chk{background:var(--accent);border-color:var(--accent);}
  .item.done .chk::after{
    content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;
    border-right:2px solid var(--chk-check);border-bottom:2px solid var(--chk-check);
    transform:rotate(42deg);
  }
  .item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .item-text{
    width:100%;border:none;background:transparent;resize:none;outline:none;
    font-size:17px;line-height:1.45;overflow:hidden;
  }
  .item.done .item-text{color:var(--sub);}
  .item-date{font-size:12px;color:var(--accent);letter-spacing:-.1px;}
  .item-result{
    width:100%;border:none;resize:none;outline:none;overflow:hidden;
    font-size:14px;line-height:1.45;color:var(--sub);
    background:var(--field);border-radius:8px;padding:7px 10px;
  }
  .item-result::placeholder{color:var(--sub);opacity:.55;}

  .ghost-add{
    display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;
    color:var(--sub);font-size:16px;
  }
  .ghost-add .ring{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    border:1.5px dashed var(--line);
  }

  .editor-screen{padding-bottom:calc(140px + env(safe-area-inset-bottom));}
  .editor-bar{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 26px calc(14px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--line);
    transition:transform .15s ease;
  }
  .editor-bar button{font-size:16px;font-weight:600;color:var(--accent);padding:6px 4px;letter-spacing:-.2px;}

  /* ===== 메모찾기 ===== */
  .find-title{font-size:28px;font-weight:700;letter-spacing:-.4px;padding:2px 2px 14px;}
  .search{
    width:100%;font-size:16px;background:var(--field);border:none;outline:none;
    border-radius:11px;padding:11px 14px;margin-bottom:14px;
  }
  .search::placeholder{color:var(--sub);opacity:.7;}
  .chips{
    display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:16px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    padding-bottom:6px;
  }
  .chips::-webkit-scrollbar{height:4px;}
  .chips::-webkit-scrollbar-track{background:transparent;}
  .chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
  .chip{
    font-size:14px;color:var(--sub);border:1px solid var(--line);
    padding:7px 14px;border-radius:999px;background:transparent;letter-spacing:-.1px;
    flex-shrink:0;white-space:nowrap;
  }
  .chip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600;}

  .find-section{font-size:13px;font-weight:700;color:var(--sub);margin:6px 2px 10px;letter-spacing:.02em;}
  .find-section .n{font-weight:500;margin-left:6px;}
  .card{
    background:var(--surface);border-radius:14px;padding:14px 15px;margin-bottom:10px;
    width:100%;text-align:left;display:block;
  }
  .card:active{opacity:1;background:var(--press);}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;}
  .card-label{
    font-size:12px;color:var(--accent);font-weight:600;letter-spacing:-.1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card-label.nolabel{color:var(--sub);font-weight:400;}
  .card-count{font-size:12px;color:var(--sub);flex-shrink:0;}
  .pline{display:flex;align-items:center;gap:9px;padding:2.5px 0;min-width:0;}
  .pline .dot{
    width:15px;height:15px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--sub);position:relative;
  }
  .pline.done .dot{background:var(--accent);border-color:var(--accent);}
  .pline .t{
    font-size:15px;line-height:1.4;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .pline.done .t{color:var(--sub);}
  .pline.more{color:var(--sub);font-size:13px;padding-left:24px;}
  .card-date{font-size:12px;color:var(--sub);margin-top:8px;}
  .find-empty{text-align:center;color:var(--sub);font-size:15px;line-height:1.7;padding:60px 20px;}
  .gap{height:18px;}

  /* ===== 시트(팝업) ===== */
  .backdrop{
    position:fixed;inset:0;background:var(--dim);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn .16s ease;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:560px;
    border-radius:18px 18px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideUp .22s cubic-bezier(.3,1,.4,1);
    max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .sheet h2{font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px;}
  .sheet .desc{font-size:14px;color:var(--sub);margin-bottom:16px;line-height:1.55;word-break:break-word;}
  .sheet .desc b{color:var(--ink);font-weight:600;}
  .label-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .label-opt{
    border:1px solid var(--line);border-radius:11px;padding:13px 8px;
    font-size:16px;text-align:center;letter-spacing:-.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .label-opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .label-opt.none{color:var(--sub);}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .sheet-foot button{font-size:16px;color:var(--accent);font-weight:600;padding:6px 2px;}
  .sheet-foot .quiet{color:var(--sub);font-weight:500;}

  .label-edit-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .label-edit-row input,.label-add-row input,.token-input{
    flex:1;font-size:16px;background:var(--field);border:none;outline:none;
    border-radius:9px;padding:10px 12px;min-width:0;
  }
  .label-edit-row .rm{font-size:14px;color:var(--danger);flex-shrink:0;padding:8px 2px;}
  .label-add-row{display:flex;align-items:center;gap:10px;padding:10px 0 2px;}
  .label-add-row .go{font-size:15px;color:var(--accent);font-weight:600;flex-shrink:0;}

  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;font-size:16px;font-weight:600;border-radius:12px;padding:14px;text-align:center;letter-spacing:-.2px;}
  .btn.primary{background:var(--ink);color:var(--bg);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.plain{background:var(--field);color:var(--ink);}

  .tool-list{display:flex;flex-direction:column;gap:10px;}
  .tool-btn{
    background:var(--field);color:var(--ink);
    font-size:15px;font-weight:600;border-radius:12px;padding:13px;text-align:center;
  }
  .snap-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 2px;border-bottom:1px solid var(--line);
  }
  .snap-row:last-child{border-bottom:none;}
  .snap-row .t{font-size:15px;}
  .snap-row .t small{display:block;font-size:12px;color:var(--sub);margin-top:2px;}
  .snap-row .go{font-size:14px;font-weight:600;color:var(--accent);flex-shrink:0;padding:6px 2px;}
  .sync-status{
    font-size:14px;font-weight:600;margin-bottom:14px;padding:11px 13px;
    background:var(--field);border-radius:10px;
  }
  .sync-err{font-size:13px;color:var(--danger);margin-top:8px;min-height:16px;}
  .steps{font-size:14px;color:var(--sub);line-height:1.7;margin-bottom:14px;}
  .steps b{color:var(--ink);font-weight:600;}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(36px);opacity:.6}to{transform:translateY(0);opacity:1}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ================================================================
   할 일 메모 — 메모하기 / 메모찾기
   저장 구조(3중):
   1) localStorage (즉시)
   2) 자동 스냅샷: 하루 1회, 최근 7일분 보관 (복원 가능)
   3) 클라우드 동기화: GitHub 비공개 Gist에 자동 백업(수정 이력 포함)
   ================================================================ */

const KEY = "memo-todo-v2";
const SNAP = "memo-todo-snap-";
const SYNC_KEY = "memo-todo-sync";
const GIST_DESC = "할일메모-데이터(자동 동기화)";
const GIST_FILE = "memo-data.json";

let state = load();
let searchQ = "";
let filterLabel = "all";
let labelEditMode = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.labels) && Array.isArray(d.memos)) return d;
  }catch(e){}
  return {
    labels:[ {id:uid(),name:"거래처"}, {id:uid(),name:"유튜브"}, {id:uid(),name:"대시보드"} ],
    memos:[], savedAt:0
  };
}
function save(opts){
  state.savedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  if(!(opts && opts.noPush)) schedulePush();
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtDate(ts){
  if(!ts) return "";
  const d = new Date(ts), now = new Date();
  const same = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const yst = new Date(now); yst.setDate(now.getDate()-1);
  if(same(d,now)) return "오늘";
  if(same(d,yst)) return "어제";
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1)+"월 "+d.getDate()+"일";
  return d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+".";
}
function fmtTime(ts){
  const d = new Date(ts);
  const h = d.getHours(), ap = h<12 ? "오전" : "오후", h12 = h%12 || 12;
  return fmtDate(ts)+" "+ap+" "+h12+":"+pad2(d.getMinutes());
}
function labelName(id){
  const l = state.labels.find(x=>x.id===id);
  return l ? l.name : "";
}
function touch(memo){ memo.updatedAt = Date.now(); save(); }

/* ---------- 라우팅 ---------- */
function route(){
  const h = location.hash;
  const m = h.match(/^#\/edit\/(.+)$/);
  if(m) return {view:"edit", id:m[1]};
  if(h === "#/find") return {view:"find"};
  return {view:"home"};
}
let lastRoute = route();
let renderedKey = null;

window.addEventListener("hashchange", ()=>{
  const r = route();
  if(lastRoute.view==="edit" && !(r.view==="edit" && r.id===lastRoute.id)){
    cleanupMemo(lastRoute.id);
  }
  lastRoute = r;
  render();
});

function cleanupMemo(id){
  const m = state.memos.find(x=>x.id===id);
  if(!m) return;
  const hasContent = m.items.some(i=> i.text.trim() || (i.result||"").trim());
  if(!hasContent){
    state.memos = state.memos.filter(x=>x.id!==id);
    save();
  }
}

const app = document.getElementById("app");
function render(force){
  const r = route();
  const key = r.view + (r.id||"");
  if(!force && r.view==="edit" && key===renderedKey) return;
  renderedKey = key;
  lastRoute = r;
  if(r.view==="edit") renderEdit(r.id);
  else if(r.view==="find") renderFind();
  else renderHome();
}

/* ================================================================
   첫 화면
   ================================================================ */
function isDoneMemo(m){
  const texted = m.items.filter(i=>i.text.trim());
  return texted.length>0 && texted.every(i=>i.done);
}
function renderHome(){
  const done = state.memos.filter(isDoneMemo).length;
  const open = state.memos.length - done;
  app.innerHTML = `
    <div class="home">
      <div class="home-mark">할 일 메모</div>
      <button class="home-panel" onclick="startNewMemo()">
        <span class="hp-title">메모하기</span>
        <span class="hp-sub">바로 새 메모가 시작됩니다</span>
      </button>
      <div class="home-hr"></div>
      <button class="home-panel" onclick="location.hash='#/find'">
        <span class="hp-title">메모찾기</span>
        <span class="hp-sub">진행 중 ${open} · 완료 ${done}</span>
      </button>
      <div class="home-foot">
        <div class="home-foot-row">
          <button onclick="openVault()">데이터 보관</button>
          <span class="sep">·</span>
          <button onclick="openSyncSheet()">동기화</button>
        </div>
        <div class="home-sync" id="homeSyncLine">${syncCfg ? esc(syncStatus) : ""}</div>
      </div>
    </div>`;
}
function startNewMemo(){
  const m = {id:uid(), labelId:null, createdAt:Date.now(), updatedAt:Date.now(),
             items:[{id:uid(), text:"", done:false, checkedAt:null, result:""}]};
  state.memos.push(m);
  save();
  location.hash = "#/edit/"+m.id;
  render();
  focusItem(0);
}

/* ================================================================
   메모하기 (편집)
   ================================================================ */
let currentId = null;
function currentMemo(){ return state.memos.find(m=>m.id===currentId); }

function renderEdit(id){
  const memo = state.memos.find(m=>m.id===id);
  if(!memo){ location.replace("#/find"); return; }
  currentId = id;
  app.innerHTML = `
    <div class="topbar">
      <button class="tb-btn" onclick="history.back()"><span class="chev">‹</span> 뒤로</button>
      <button class="tb-btn danger" onclick="askDeleteMemo()">삭제</button>
    </div>
    <div class="screen editor-screen">
      <div class="memo-meta">
        <span class="when">${fmtDate(memo.createdAt)} 작성</span>
        <button class="label-chip ${memo.labelId && labelName(memo.labelId) ? "" : "empty"}"
                onclick="openLabelSheet()">${esc(labelName(memo.labelId) || "라벨 지정")}</button>
      </div>
      <div id="items"></div>
      <button class="ghost-add" onclick="addItem()"><span class="ring"></span>새 항목</button>
    </div>
    <div class="editor-bar" id="editorBar">
      <button onclick="openLabelSheet()">라벨</button>
      <button onclick="newMemoFromEditor()">새 메모</button>
    </div>`;
  buildItems(memo);
  adjustBar();
}

function buildItems(memo){
  const wrap = document.getElementById("items");
  if(!wrap) return;
  wrap.innerHTML = "";
  memo.items.forEach((it, idx)=> wrap.appendChild(itemNode(memo, it, idx)));
}

function itemNode(memo, it, idx){
  const row = document.createElement("div");
  row.className = "item" + (it.done ? " done" : "");

  const chk = document.createElement("button");
  chk.className = "chk";
  chk.setAttribute("aria-label", it.done ? "완료 취소" : "완료");
  chk.onclick = ()=>{
    it.done = !it.done;
    it.checkedAt = it.done ? Date.now() : null;
    touch(memo);
    buildItems(memo);
  };

  const body = document.createElement("div");
  body.className = "item-body";

  const ta = document.createElement("textarea");
  ta.className = "item-text";
  ta.rows = 1;
  ta.value = it.text;
  ta.placeholder = "할 일";
  ta.oninput = ()=>{ it.text = ta.value; grow(ta); touch(memo); };
  ta.onkeydown = (e)=>{
    if(e.key === "Enter"){
      e.preventDefault();
      insertItemAfter(memo, idx);
    }else if(e.key === "Backspace" && ta.value === "" && memo.items.length > 1){
      e.preventDefault();
      removeItem(memo, idx);
    }
  };
  body.appendChild(ta);

  if(it.done && it.checkedAt){
    const d = document.createElement("div");
    d.className = "item-date";
    d.textContent = fmtDate(it.checkedAt) + " 완료";
    body.appendChild(d);
  }

  const res = document.createElement("textarea");
  res.className = "item-result";
  res.rows = 1;
  res.value = it.result || "";
  res.placeholder = "처리 결과";
  res.oninput = ()=>{ it.result = res.value; grow(res); touch(memo); };
  body.appendChild(res);

  row.appendChild(chk);
  row.appendChild(body);
  requestAnimationFrame(()=>{ grow(ta); grow(res); });
  return row;
}

function grow(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
function focusItem(idx, toEnd){
  const list = document.querySelectorAll(".item-text");
  const el = list[Math.min(idx, list.length-1)];
  if(el){
    el.focus();
    if(toEnd){ const n = el.value.length; el.setSelectionRange(n, n); }
  }
}
function addItem(){
  const memo = currentMemo();
  if(!memo) return;
  memo.items.push({id:uid(), text:"", done:false, checkedAt:null, result:""});
  touch(memo);
  buildItems(memo);
  focusItem(memo.items.length-1);
}
function insertItemAfter(memo, idx){
  memo.items.splice(idx+1, 0, {id:uid(), text:"", done:false, checkedAt:null, result:""});
  touch(memo);
  buildItems(memo);
  focusItem(idx+1);
}
function removeItem(memo, idx){
  memo.items.splice(idx, 1);
  touch(memo);
  buildItems(memo);
  focusItem(Math.max(0, idx-1), true);
}
function newMemoFromEditor(){
  const memo = currentMemo();
  if(memo){
    const empty = !memo.items.some(i=> i.text.trim() || (i.result||"").trim());
    if(empty){ focusItem(0); return; }
  }
  const m = {id:uid(), labelId:null, createdAt:Date.now(), updatedAt:Date.now(),
             items:[{id:uid(), text:"", done:false, checkedAt:null, result:""}]};
  state.memos.push(m);
  save();
  location.hash = "#/edit/"+m.id;
  render();
  focusItem(0);
}

function renderFind(){
  app.innerHTML = `

      <span></span>

             oninput="onSearch(this.value)">
      <div id="chips" class="chips"></div>
      <div id="findResults"></div>
    </div>`;
  renderChips();
  renderResults();
}
function onSearch(v){ searchQ = v; renderResults(); }
function setFilter(id){ filterLabel = id; renderChips(); renderResults(); }

function renderChips(){
  const box = document.getElementById("chips");
  if(!box) return;
  box.innerHTML =
    `<button class="chip ${filterLabel==="all"?"on":""}" onclick="setFilter('all')">전체</button>` +
    state.labels.map(l=>
      `<button class="chip ${filterLabel===l.id?"on":""}" onclick="setFilter('${l.id}')">${esc(l.name)}</button>`).join("");
}

function memoMatches(m, q){
  if(!q) return true;
  if((labelName(m.labelId)||"").toLowerCase().includes(q)) return true;
  return m.items.some(i=>
    i.text.toLowerCase().includes(q) || (i.result||"").toLowerCase().includes(q));
}

function renderResults(){
  const box = document.getElementById("findResults");
  if(!box) return;
  const q = searchQ.trim().toLowerCase();
  let memos = state.memos.slice();
  if(filterLabel!=="all") memos = memos.filter(m=>m.labelId===filterLabel);
  memos = memos.filter(m=>memoMatches(m, q));
  memos.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  const open = memos.filter(m=>!isDoneMemo(m));
  const done = memos.filter(isDoneMemo);

  if(!open.length && !done.length){
    box.innerHTML = `<div class="find-empty">${q || filterLabel!=="all"
      ? "조건에 맞는 메모가 없습니다."
      : "아직 메모가 없습니다.<br>첫 화면의 메모하기에서 시작해 보세요."}</div>`;
    return;
  }
  let html = "";
  if(open.length){
    html += `<div class="find-section">진행 중<span class="n">${open.length}</span></div>`;
    html += open.map(cardHTML).join("");
  }
  if(done.length){
    if(open.length) html += `<div class="gap"></div>`;
    html += `<div class="find-section">완료<span class="n">${done.length}</span></div>`;
    html += done.map(cardHTML).join("");
  }
  box.innerHTML = html;
}

function cardHTML(m){
  const texted = m.items.filter(i=>i.text.trim());
  const doneN = texted.filter(i=>i.done).length;
  const shown = texted.slice(0,3);
  const lines = shown.map(i=>
    `<div class="pline ${i.done?"done":""}"><span class="dot"></span><span class="t">${esc(i.text)}</span></div>`).join("")
    || `<div class="pline"><span class="t" style="color:var(--sub)">빈 메모</span></div>`;
  const more = texted.length>3 ? `<div class="pline more">외 ${texted.length-3}개</div>` : "";
  const ln = labelName(m.labelId);
  return `<button class="card" onclick="location.hash='#/edit/${m.id}'">
    <div class="card-top">
      <span class="card-label ${ln?"":"nolabel"}">${ln?esc(ln):"라벨 없음"}</span>
      <span class="card-count">${texted.length?`${doneN}/${texted.length}`:""}</span>
    </div>
    ${lines}${more}
    <div class="card-date">${fmtDate(m.createdAt)} 작성</div>
  </button>`;
}

function dailySnapshot(){
  const d = new Date();
  const k = SNAP + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
  if(!localStorage.getItem(k)){
    try{ localStorage.setItem(k, JSON.stringify({at:Date.now(), data:state})); }catch(e){}
  }
  pruneSnaps();
}
function snapKeys(){
  const ks = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SNAP)===0) ks.push(k);
  }
  return ks.sort().reverse();
}
function pruneSnaps(){ snapKeys().slice(7).forEach(k=>localStorage.removeItem(k)); }
function askRestoreSnap(key){

/* ================================================================
   3중 보관 — GitHub 비공개 Gist 클라우드 동기화
   ================================================================ */
let syncCfg = (function(){
  try{
    const d = JSON.parse(localStorage.getItem(SYNC_KEY));
    if(d && d.token && d.gistId) return d;
  }catch(e){}
  return null;
})();
let syncStatus = syncCfg ? "동기화 확인 중…" : "";
let pushTimer = null, pushing = false, pendingPush = false;

function saveSyncCfg(){ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }
function setStatus(s){
  syncStatus = s;
  const el = document.getElementById("syncStatusBox");
  if(el) el.textContent = s;
  const hf = document.getElementById("homeSyncLine");
  if(hf) hf.textContent = syncCfg ? s : "";
}

async function gh(path, opts){
  opts = opts || {};
  const headers = {
    "Authorization": "Bearer " + syncCfg.token,
    "Accept": "application/vnd.github+json"
  };
  if(opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch("https://api.github.com"+path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body || undefined,
    keepalive: !!opts.keepalive
  });
  if(res.status===401 || res.status===403) throw new Error("auth");
  if(!res.ok) throw new Error("http "+res.status);
  return res.json();
}

async function connectSync(token){
  syncCfg = {token: token};
  const gists = await gh("/gists?per_page=100");
  const found = gists.find(g=>g.description===GIST_DESC);
  if(found){
    syncCfg.gistId = found.id;
    saveSyncCfg();
    await pullRemote();
  }else{
    const g = await gh("/gists", {method:"POST", body:JSON.stringify({
      description: GIST_DESC, public: false,
      files: {[GIST_FILE]: {content: JSON.stringify(state)}}
    })});
    syncCfg.gistId = g.id;
    syncCfg.lastPushAt = Date.now();
    saveSyncCfg();
  }
  setStatus("동기화됨 · "+fmtTime(Date.now()));
}

async function pullRemote(){
  const g = await gh("/gists/"+syncCfg.gistId);
  const f = g.files[GIST_FILE];
  if(!f) return;
  let text = f.content;
  if(f.truncated){
    const r = await fetch(f.raw_url);
    text = await r.text();
  }
  let remote = null;
  try{ remote = JSON.parse(text); }catch(e){}
  if(!remote || !Array.isArray(remote.memos) || !Array.isArray(remote.labels)) return;
  const ls = state.savedAt||0, rs = remote.savedAt||0;
  if(rs > ls){
    try{ localStorage.setItem(SNAP+"교체전"+Date.now(), JSON.stringify({at:Date.now(), data:state})); }catch(e){}
    pruneSnaps();
    state = remote;
    save({noPush:true});
    render(true);
  }else if(ls > rs){
    schedulePush(400);
  }
  syncCfg.lastPullAt = Date.now();
  saveSyncCfg();
  setStatus("동기화됨 · "+fmtTime(Date.now()));
}

function schedulePush(delay){
  if(!syncCfg || !syncCfg.gistId) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, delay==null ? 2500 : delay);
  setStatus("저장됨 · 동기화 대기");
}
async function doPush(opts){
  if(!syncCfg || !syncCfg.gistId) return;
  if(pushing){ pendingPush = true; return; }
  pushing = true;
  pushTimer = null;
  try{
    setStatus("동기화 중…");
    await gh("/gists/"+syncCfg.gistId, {method:"PATCH",
      keepalive: !!(opts && opts.keepalive),
      body: JSON.stringify({files:{[GIST_FILE]:{content: JSON.stringify(state)}}})});
    syncCfg.lastPushAt = Date.now();
    saveSyncCfg();
    setStatus("동기화됨 · "+fmtTime(syncCfg.lastPushAt));
  }catch(e){
    setStatus(e.message==="auth"
      ? "토큰 오류 — 동기화에서 다시 연결하세요"
      : "오프라인 — 다음 저장 때 다시 시도합니다");
  }
  pushing = false;
  if(pendingPush){ pendingPush = false; schedulePush(500); }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden" && pushTimer){
    clearTimeout(pushTimer);
    doPush({keepalive:true});
  }
});

        <button class="btn plain" onclick="closeSheet()">취소</button>
        <button class="btn primary" id="connectBtn" onclick="connectFromSheet()">연결</button>
      </div>`);
  }
}
async function connectFromSheet(){
  const inp = document.getElementById("tokenInput");
  const tk = (inp.value||"").trim();
  if(!tk){ inp.focus(); return; }
  const btn = document.getElementById("connectBtn");
  btn.textContent = "연결 중…";
  try{
    await connectSync(tk);
    openSyncSheet();
    render(true);
  }catch(e){
    syncCfg = null;
    localStorage.removeItem(SYNC_KEY);
    const el = document.getElementById("syncErr");
    if(el) el.textContent = e.message==="auth"
      ? "토큰이 올바르지 않거나 gist 권한이 없습니다."
      : "연결하지 못했습니다. 네트워크를 확인해 주세요.";
    btn.textContent = "연결";
  }
}
async function manualSync(){
  try{
    setStatus("동기화 중…");
    await pullRemote();
    await doPush();
  }catch(e){
    setStatus(e.message==="auth" ? "토큰 오류 — 다시 연결하세요" : "오프라인 — 나중에 다시 시도하세요");
  }
}
function disconnectSync(){
  syncCfg = null;
  localStorage.removeItem(SYNC_KEY);
  setStatus("");
  closeSheet();
  render(true);
}

/* ================================================================
   사파리 안정화 + 키보드 위 하단 바 + PWA
   ================================================================ */
document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("dblclick", e=>e.preventDefault());

function adjustBar(){
  const bar = document.getElementById("editorBar");
  if(!bar || !window.visualViewport) return;
  const vv = window.visualViewport;
  const overlap = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  bar.style.transform = overlap ? "translateY(-"+overlap+"px)" : "";
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", adjustBar);
  window.visualViewport.addEventListener("scroll", adjustBar);
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}

/* ---------- 시작 ---------- */
save({noPush:true});
dailySnapshot();
render();
if(syncCfg && syncCfg.gistId){
  pullRemote().catch(e=>{
    setStatus(e.message==="auth" ? "토큰 오류 — 동기화에서 다시 연결하세요" : "오프라인 — 연결되면 자동 동기화됩니다");
  });
}
